<!doctype html>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #0a0c10; color: #e8edf3; font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .panel { width: min(560px, 100%); padding: 40px 28px; background: #161b22; border: 1px solid #2c333d; border-top-color: #3d4651; border-radius: 4px; text-align: center; }
    .code { margin: 0; font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: .18em; color: #ffb020; }
    /* Puerto RJ45 desconectado */
    .jack { position: relative; width: 72px; height: 58px; margin: 28px auto 42px; background: #05070a; border: 2px solid #ff6b5b; border-radius: 3px; }
    .jack::before { content: ''; position: absolute; left: 14px; right: 14px; top: 9px; height: 11px; background: repeating-linear-gradient(90deg, #c9a44c 0 2px, transparent 2px 5px); }
    .jack::after { content: ''; position: absolute; left: 50%; bottom: -14px; width: 28px; height: 14px; margin-left: -14px; background: #05070a; border: 2px solid #ff6b5b; border-top: 0; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; text-transform: uppercase; }
    p { margin: 0; color: #b4bec9; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border-radius: 6px; font-weight: 700; text-decoration: none; }
    .btn-home { background: #19c3ff; color: #04121c; }
    .btn-wa { background: #25d366; color: #04210f; }
  </style>
</head>
