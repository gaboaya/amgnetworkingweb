  <style>
    :root { color-scheme: light; }

    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 20px; background: #f4f6f9; color: #1b2a3a; font: 17px/1.6 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; }

    h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 36px); line-height: 1.15; letter-spacing: -0.02em; color: #0b2545; }
    p { margin: 0; color: #4f5f70; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border: 1px solid transparent; border-radius: 4px; font-weight: 600; text-decoration: none; }
    .btn-primary { background: #0b6bcb; color: #fff; }
    .btn-primary:hover { background: #084f97; }
    .btn-outline { border-color: #0b2545; color: #0b2545; }
