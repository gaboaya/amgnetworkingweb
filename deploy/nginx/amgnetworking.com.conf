# Nginx para amgnetworking.com (pasos de instalación en deploy/README.md)
#   sudo cp deploy/nginx/amgnetworking.com.conf /etc/nginx/sites-available/amgnetworking.com
#   sudo nginx -t && sudo systemctl reload nginx

# Caché según el tipo de archivo
map $uri $amg_cache_control {
    ~^/assets/                       "public, max-age=31536000, immutable";  # llevan un código en el nombre: nunca cambian
    ~\.(html|xml|txt|webmanifest)$   "no-cache";                             # páginas, sitemap y robots: siempre al día
    default                          "public, max-age=604800";               # imágenes e íconos: 7 días
}

# http → https, y renovación del certificado de Let's Encrypt
server {
    listen 80;
    listen [::]:80;
    server_name amgnetworking.com www.amgnetworking.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://amgnetworking.com$request_uri;
    }
}

# www → sin www, para que Google vea una sola versión del sitio
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.amgnetworking.com;

    ssl_certificate /etc/letsencrypt/live/amgnetworking.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amgnetworking.com/privkey.pem;

    return 301 https://amgnetworking.com$request_uri;
}

# El sitio
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name amgnetworking.com;

    ssl_certificate /etc/letsencrypt/live/amgnetworking.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amgnetworking.com/privkey.pem;

    root /var/www/amgnetworking/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

    add_header Cache-Control $amg_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Actívalo cuando confirmes que el HTTPS funciona bien (los navegadores usarán siempre https):
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Tipo correcto para el manifest (algunas versiones de Nginx no lo conocen)
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # No mostrar archivos ocultos
    location ~ /\.(?!well-known) {
        deny all;
    }
}
