# Nginx para amgnetworking.com detrás de Cloudflare Tunnel (pasos en deploy/README.md)
#   sudo cp deploy/nginx/amgnetworking.com.conf /etc/nginx/sites-available/amgnetworking.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare atiende el https y envía las visitas por el túnel a http://localhost:82,
# así que aquí no hacen falta certificados.

# Caché según el tipo de archivo
map $uri $amg_cache_control {
    ~^/assets/                       "public, max-age=31536000, immutable";  # llevan un código en el nombre: nunca cambian
    ~\.(html|xml|txt|webmanifest)$   "no-cache";                             # páginas, sitemap y robots: siempre al día
    default                          "public, max-age=604800";               # imágenes e íconos: 7 días
}

# www → sin www, para que Google vea una sola versión del sitio
server {
    listen 82;
    server_name www.amgnetworking.com;
    return 301 https://amgnetworking.com$request_uri;
}

# El sitio
server {
    listen 82;
    server_name amgnetworking.com;

    root /var/www/amgnetworking/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Cloudflare indica en CF-Visitor si la visita llegó por http: se pasa a https
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://amgnetworking.com$request_uri;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml text/plain;

    add_header Cache-Control $amg_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Las direcciones que no existen muestran 404.html (no la página de inicio), como pide Google
    location / {
        try_files $uri $uri/ =404;
    }

    # Tipo correcto para el manifest (algunas versiones de Nginx no lo conocen)
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    # No mostrar archivos ocultos
    location ~ /\. {
        deny all;
    }
}
